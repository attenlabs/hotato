# Pipeline: test -> leak scan -> copy check -> benchmark-regression -> private Atlas wheel -> container build -> deploy -> site -> release.
# Runs as the hotato-build service account (no keys). Submit from the repository root with:
#   gcloud builds submit --config autopilot/build/cloudbuild.yaml --substitutions _DEPLOY=true,_CF_ACCOUNT_ID=...
# Deploy, site and release steps do nothing unless _DEPLOY=true (and _RELEASE=true for the release).
substitutions:
  _REGION: us-central1
  _DEPLOY: "false"
  _RELEASE: "false"
  _CF_ACCOUNT_ID: ""
  _PAGES_PROJECT: hotato-site
  # Artifact Registry repository name. The full path is built in each step from built-ins
  # (a substitution's default value cannot reference $PROJECT_ID: it stays literal).
  _AR_REPO: hotato
  # The Atlas collector (hotato-atlas) is a private package in this project's Python repository
  # (infra/main.tf private_py). Exact pin; bump it together with build/publish-atlas-wheel.sh.
  _ATLAS_PY_REPO: hotato-private-py
  _ATLAS_VERSION: "0.1.0"

timeout: 3600s

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE
  machineType: E2_HIGHCPU_8

serviceAccount: projects/$PROJECT_ID/serviceAccounts/hotato-build@$PROJECT_ID.iam.gserviceaccount.com

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/cloudflare-pages-token/versions/latest
      env: CLOUDFLARE_API_TOKEN

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # Release tests build throwaway git repos, so the suite needs the git program.
        apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
        pip install -q -e '.[dev]' -r autopilot/requirements.txt -r autopilot/requirements-dev.txt
        python -m pytest -q
        cd autopilot && python -m pytest -q tests

  - id: leak-scan
    name: python:3.12-slim
    entrypoint: python
    args: ["autopilot/scan/leakscan.py"]
    waitFor: ["-"]

  - id: copy-check
    name: python:3.12-slim
    entrypoint: bash
    # The site source lives in its own repository until it is merged here; until then the public
    # landing text in this repository is checked.
    args: ["-c", "if [ -d site ]; then python autopilot/build/copycheck.py site; else python autopilot/build/copycheck.py README.md README.pypi.md llms.txt; fi"]
    waitFor: ["-"]

  - id: benchmark
    name: python:3.12-slim
    entrypoint: bash
    env: ["BENCH_BASELINE=autopilot/build/benchmark-baseline.json"]
    args: ["-c", "pip install -q -e . && python autopilot/build/benchmark_check.py"]
    waitFor: ["test"]

  # Downloads the pinned private wheel with the build's own identity: the keyring plugin gets a
  # short-lived token from the metadata server and nothing is written to the workspace except the
  # wheel. Only this index is consulted (no PyPI fallback for the name), with no dependencies.
  # The Docker build below installs the downloaded file with --no-index, so no credential ever
  # enters an image layer. Runs after the leak scan (which then never reads the wheel) and after
  # the monitor image (whose build copies the whole workspace and must not pick the wheel up).
  - id: atlas-wheel
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install -q --no-cache-dir keyrings.google-artifactregistry-auth==1.1.2
        rm -rf autopilot/build/private-wheels
        pip download -q --no-cache-dir --no-deps --only-binary=:all: --keyring-provider import \
          --index-url "https://${_REGION}-python.pkg.dev/$PROJECT_ID/${_ATLAS_PY_REPO}/simple/" \
          --dest autopilot/build/private-wheels "hotato-atlas==${_ATLAS_VERSION}"
        ls autopilot/build/private-wheels
    waitFor: ["leak-scan", "image-monitor"]

  - id: image-jobs
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "autopilot/build/Dockerfile.jobs", "--build-arg", "ATLAS_VERSION=${_ATLAS_VERSION}", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/jobs:$BUILD_ID", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/jobs:latest", "."]
    waitFor: ["test", "leak-scan", "copy-check", "benchmark", "atlas-wheel"]

  - id: image-monitor
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "autopilot/build/Dockerfile.monitor", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/monitor:$BUILD_ID", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/monitor:latest", "."]
    waitFor: ["test", "leak-scan", "copy-check", "benchmark"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/jobs"]
    waitFor: ["image-jobs"]

  - id: push-monitor
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/monitor"]
    waitFor: ["image-monitor"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        [ "$_DEPLOY" = "true" ] || { echo "deploy skipped"; exit 0; }
        for j in atlas upkeep builder reviewer freshness scorecard simulate; do
          gcloud run jobs update "hotato-$$j" --region "$_REGION" --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/jobs:$BUILD_ID"
        done
        gcloud run deploy hotato-monitor --region "$_REGION" --image "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/monitor:$BUILD_ID"
    waitFor: ["push", "push-monitor"]

  # hotato.dev stays on Cloudflare Pages.
  - id: site
    name: node:22-slim
    entrypoint: bash
    secretEnv: ["CLOUDFLARE_API_TOKEN"]
    env: ["CLOUDFLARE_ACCOUNT_ID=$_CF_ACCOUNT_ID"]
    args:
      - -c
      - |
        [ "$_DEPLOY" = "true" ] || { echo "site deploy skipped"; exit 0; }
        [ -d site ] || { echo "site deploy skipped: no site/ in this repository"; exit 0; }
        npx --yes wrangler@3.99.0 pages deploy site --project-name "$_PAGES_PROJECT" --branch main
    waitFor: ["deploy"]

  # PyPI trusted publishing: this build's service account is the publisher identity.
  # An identity token is exchanged for a short-lived upload token; no PyPI secret is stored.
  - id: release
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        [ "$_RELEASE" = "true" ] || { echo "release skipped"; exit 0; }
        pip install -q build twine
        python -m build
        ID=$$(python - <<'PY'
        import urllib.request
        u = "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=pypi&format=full"
        print(urllib.request.urlopen(urllib.request.Request(u, headers={"Metadata-Flavor": "Google"})).read().decode())
        PY
        )
        TOKEN=$$(python - "$$ID" <<'PY'
        import json, sys, urllib.request
        r = urllib.request.Request("https://pypi.org/_/oidc/mint-token", data=json.dumps({"token": sys.argv[1]}).encode(),
                                   headers={"Content-Type": "application/json"})
        print(json.load(urllib.request.urlopen(r))["token"])
        PY
        )
        TWINE_USERNAME=__token__ TWINE_PASSWORD="$$TOKEN" twine upload dist/*
    waitFor: ["site", "test", "leak-scan", "copy-check", "benchmark"]
